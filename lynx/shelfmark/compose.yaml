services:
  shelfmark:
    # https://github.com/calibrain/shelfmark
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    restart: unless-stopped
    networks:
      - media-tier
    ports:
      - 8084:8084
    volumes:
      - ${SHELFMARK_APPDATA_PATH:?}/config:/config
      - ${BOOKS_PATH:?}/ebooks:/books
      - ${BOOKS_PATH:?}/audiobooks:/audiobooks
      - ${BOOKS_PATH:?}/bookdrop:/bookdrop
      - ${DOWNLOADS_PATH:?}/complete:/data/downloads/complete
    environment:
      - TZ=Europe/Berlin
      - AUTH_METHOD=oidc
      - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL:?}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:?}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:?}
      - OIDC_ADMIN_GROUP=${OIDC_ADMIN_GROUP:?}
      - OIDC_BUTTON_LABEL=${OIDC_BUTTON_LABEL:?}
      - HIDE_LOCAL_AUTH=true
      - OIDC_AUTO_REDIRECT=false
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8084/api/health"]
      interval: 30s
      timeout: 30s
      retries: 3

networks:
  media-tier:
    external: true