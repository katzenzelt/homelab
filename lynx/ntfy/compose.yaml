services:
  ntfy:
    # https://github.com/binwiederhier/ntfy // https://hub.docker.com/r/binwiederhier/ntfy/
    image: binwiederhier/ntfy:v2
    container_name: ntfy
    restart: unless-stopped
    init: true
    command:
      - serve
    ports:
      - 8082:80
    volumes:
      - ${NTFY_APPDATA_PATH:?}/cache:/var/cache/ntfy
      - ${NTFY_APPDATA_PATH:?}/etc:/etc/ntfy
    environment:
      - TZ=Europe/Berlin
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s