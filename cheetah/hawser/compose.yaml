services:
  hawser:
    # https://github.com/Finsys/hawser
    image: ghcr.io/finsys/hawser:v0.2.47
    container_name: hawser
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKHAND_SERVER_URL=ws://${DOCKHAND_TAILSCALE_IP:?}:3002/api/hawser/connect
      - TOKEN=${HAWSER_TOKEN:?}
    labels:
      - "dockhand.adopt=false"