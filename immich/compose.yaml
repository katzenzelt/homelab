name: immich

services:
  immich-server:
    # https://github.com/immich-app/immich
    image: ghcr.io/immich-app/immich-server:v3
    container_name: immich_server
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    depends_on:
      - redis
      - database
    ports:
      - 2283:2283
    volumes:
      - ${IMMICH_MEDIA_PATH:?}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Europe/Berlin
      DB_PASSWORD: ${DB_PASSWORD:?}
    healthcheck:
      disable: false

  immich-machine-learning:
    # https://github.com/immich-app/immich
    image: ghcr.io/immich-app/immich-machine-learning:v3
    container_name: immich_machine_learning
    restart: unless-stopped
    volumes:
      - model-cache:/cache
    healthcheck:
      disable: false

  redis:
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    container_name: immich_redis
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    restart: unless-stopped
    shm_size: 128mb
    volumes:
      - ${IMMICH_POSTGRES_PATH:?}:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
      DB_STORAGE_TYPE: HDD
    healthcheck:
      disable: false

volumes:
  model-cache: